name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*-eajelly*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            platform: windows64
            msystem: CLANG64
            pkg_prefix: mingw-w64-clang-x86_64
            triple: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            platform: windowsarm64
            msystem: CLANGARM64
            pkg_prefix: mingw-w64-clang-aarch64
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-cef
        with:
          platform: ${{ github.workflow }}-${{ matrix.arch }}

      - name: Read mpv revision
        id: mpv
        shell: bash
        run: echo "revision=$(git -C third_party/mpv rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache built mpv
        id: mpv-cache
        uses: actions/cache@v6
        with:
          path: third_party/mpv-install
          key: mpv-windows-v1-${{ matrix.arch }}-${{ steps.mpv.outputs.revision }}-${{ hashFiles('dev/windows/build_mpv_source.ps1') }}

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src -> ../build/cargo-target
          shared-key: windows-${{ matrix.arch }}
          cache-on-failure: true

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}

      - name: Install MSYS2 dependencies
        shell: msys2 {0}
        run: |
          # Slow ARM mirrors can trip pacman's curl low-speed cutoff. Keep
          # downloads alive and retry the transaction after refreshing mirrors.
          sed -i 's/^#DisableDownloadTimeout/DisableDownloadTimeout/' /etc/pacman.conf
          packages=(
            ${{ matrix.pkg_prefix }}-cc
            ${{ matrix.pkg_prefix }}-clang
            ${{ matrix.pkg_prefix }}-meson
            ${{ matrix.pkg_prefix }}-pkgconf
            ${{ matrix.pkg_prefix }}-ffmpeg
            ${{ matrix.pkg_prefix }}-libplacebo
            ${{ matrix.pkg_prefix }}-libass
            ${{ matrix.pkg_prefix }}-vulkan-headers
            ${{ matrix.pkg_prefix }}-vulkan-loader
            ${{ matrix.pkg_prefix }}-shaderc
            ${{ matrix.pkg_prefix }}-spirv-cross
            ${{ matrix.pkg_prefix }}-llvm
            ${{ matrix.pkg_prefix }}-tools
          )
          for attempt in 1 2 3; do
            if pacman -S --needed --noconfirm "${packages[@]}"; then
              exit 0
            fi
            echo "MSYS2 package installation failed (attempt ${attempt}/3); refreshing databases before retry"
            pacman -Syy --noconfirm || true
            sleep $((attempt * 10))
          done
          exit 1

      - name: Set up libclang for bindgen
        shell: pwsh
        run: |
          # bindgen runs inside the MSVC-hosted Rust process. Prefer a native
          # LLVM installation because MSYS2's libclang can be present yet fail
          # to load from a MSVC process due to its MinGW runtime dependencies.
          $candidates = @(
            (Join-Path $env:ProgramFiles "LLVM\bin"),
            (Join-Path ${env:ProgramFiles(x86)} "LLVM\bin")
          )
          $msysBin = "C:\msys64\${{ matrix.msystem }}".ToLowerInvariant() + "\bin"
          $candidates += $msysBin
          $clangDir = $candidates |
            Where-Object { Test-Path (Join-Path $_ "libclang.dll") } |
            Select-Object -First 1

          if (-not $clangDir) {
            choco install llvm -y --no-progress
            $clangDir = Join-Path $env:ProgramFiles "LLVM\bin"
          }
          if (-not (Test-Path (Join-Path $clangDir "libclang.dll"))) {
            throw "libclang.dll was not found after LLVM setup"
          }

          "LIBCLANG_PATH=$clangDir" >> $env:GITHUB_ENV
          "PATH=$clangDir;$env:PATH" >> $env:GITHUB_ENV
          Write-Host "Using libclang from $clangDir"

      - name: Build mpv from source
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          dev\windows\build_mpv_source.ps1 -Arch ${{ matrix.arch }}

      - name: Build and package
        shell: cmd
        env:
          # Set by the libclang setup step above.
          MSYS_BIN: C:\msys64\${{ matrix.msystem }}\bin
          # mingw's libclang doesn't auto-pick the MSVC target triple, so
          # MSVC's arch-specific headers (__int64, vcruntime intrinsics,
          # etc.) get parsed against the wrong default target. Pin it.
          BINDGEN_EXTRA_CLANG_ARGS: --target=${{ matrix.triple }}
          MATRIX_ARCH: ${{ matrix.arch }}
          # The workspace's fat LTO + one codegen unit is unnecessarily slow
          # for CI packaging. Thin LTO retains cross-crate optimization while
          # allowing the Windows release build to compile/link in parallel.
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 4
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" %MATRIX_ARCH% || exit /b 1
          set "PATH=%PATH%;%MSYS_BIN%"
          cargo xtask package --external-mpv "%CD%\third_party\mpv-install" --prefix build/install --dist dist

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (cargo xtask version).Trim()
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $source = (Resolve-Path build/install).Path
          $output = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=$version" "/DAppArch=${{ matrix.arch }}" "/DSourceDir=$source" "/DOutputDir=$output" resources/win/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/JelliumDesktop-*.zip
            dist/JelliumDesktop-*-setup.exe

      - name: Add installers to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/JelliumDesktop-*.zip
            dist/JelliumDesktop-*-setup.exe
